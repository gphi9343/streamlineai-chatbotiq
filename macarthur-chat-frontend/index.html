<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macarthur Marble &amp; Granite — Enquiries</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <img class="logo" src="assets/mmg-logo.png"
             alt="Macarthur Marble &amp; Granite" />
        <p class="tagline">Benchtops · Splashbacks · Stone Installation</p>
      </div>
      <button id="new-conversation" class="btn-secondary" type="button">
        New chat
      </button>
    </header>
    <div class="pulse-line"></div>
    <main>
      <div id="messages" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <input
          id="input"
          type="text"
          placeholder="Ask us anything about your benchtop or splashback…"
          maxlength="4000"
          required
        />
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="chat.js"></script>
</body>
</html>
