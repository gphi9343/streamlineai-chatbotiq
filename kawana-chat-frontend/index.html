<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kawana Flooring — Enquiries</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <!-- Text wordmark — Kawana has no logo image asset. Two lines,
             light serif, styled in style.css (.wordmark). -->
        <p class="wordmark"><span>Kawana</span><span>Flooring</span></p>
        <p class="tagline">Carpet · Hybrid · Vinyl · Timber · Synthetic Grass</p>
      </div>
      <button id="new-conversation" class="btn-secondary" type="button">
        New chat
      </button>
    </header>
    <div class="pulse-line"></div>
    <main>
      <div id="messages" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <input
          id="input"
          type="text"
          placeholder="Ask us anything about flooring for your home…"
          maxlength="4000"
          required
        />
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="chat.js"></script>
</body>
</html>
